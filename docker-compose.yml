services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./config/business.yaml:/app/config/business.yaml:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:${WEBHOOK_BIND_PORT:-8080}"
    stop_grace_period: 2m

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: bale_campaign_bot
      POSTGRES_USER: bale_campaign_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bale_campaign_bot -d bale_campaign_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
