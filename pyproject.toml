[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bale-campaign-bot"
version = "0.1.0"
description = "Self-hosted opt-in campaign bot for the Bale messenger"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bale Campaign Bot contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<8",
  "pip-audit>=2.7,<3",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
bale-campaign-bot = "bale_campaign_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bale_campaign_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*", "respx.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["bale_campaign_bot.bale"]

[tool.coverage.report]
show_missing = true
fail_under = 85
